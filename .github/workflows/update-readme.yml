name: Update Profile Readme

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}     
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update recent activity section
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_LINES: 5

      - name: Update last-refreshed timestamp
        run: |
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i "s|<!--LAST_UPDATED-->.*<!--END_LAST_UPDATED-->|<!--LAST_UPDATED-->${NOW}<!--END_LAST_UPDATED-->|" README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update profile activity & timestamp"
          file_pattern: README.md
